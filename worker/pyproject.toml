[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101", "S104", "S311"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--tb=short -p no:cacheprovider"
testpaths = ["tests"]
markers = ["integration: requires the real local Compose stack"]
