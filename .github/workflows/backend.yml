name: Backend platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate local-only test configuration
        run: node scripts/setup-backend.mjs
      - name: Validate fail-closed Oracle deployment configuration
        run: |
          node scripts/setup-oracle.mjs --host api.filenimble.app --email ci@example.net
          node scripts/check-oracle.mjs
      - name: Test local-only operator watchdog logic
        run: node --test scripts/oracle.setup.test.mjs scripts/oracle-watchdog.test.mjs
      - name: Validate and build backend test images
        run: |
          node scripts/prepare-media.mjs
          docker compose --env-file .env.backend.local -f compose.yaml -f compose.test.yaml config --quiet
          docker compose --env-file .env.backend.local --profile build build api sandbox-image ocr-image media-image archive-image
      - name: Verify required backend test images
        run: |
          for image in filenimble-backend:phase5 filenimble-sandbox:phase5 filenimble-ocr:phase7 filenimble-media:phase11 filenimble-archive:phase11; do
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              echo "::error::Required backend test image is missing: $image"
              exit 1
            fi
          done
      - name: Python checks
        run: |
          docker run --rm filenimble-backend:phase5 ruff check --no-cache /app
          docker run --rm filenimble-backend:phase5 ruff format --check --no-cache /app
          docker run --rm filenimble-backend:phase5 pip check
      - name: Start real services
        run: docker compose --env-file .env.backend.local -f compose.yaml -f compose.test.yaml up -d postgres redis storage migrate api worker lifecycle supervisor
      - name: Prepare backend test reports
        run: mkdir -p .ci-test-results
      - name: Real pipeline and failure-injection tests
        run: |
          set +e
          docker compose --env-file .env.backend.local -f compose.yaml -f compose.test.yaml run --rm tests pytest -q -m "not production_integration" --junitxml=/ci-test-results/backend-standard.xml >.ci-test-results/backend-standard.log 2>&1
          status=$?
          echo "Standard backend pytest exit code: $status"
          exit "$status"
      - name: Stop disposable test stack
        if: always()
        run: docker compose --env-file .env.backend.local -f compose.yaml -f compose.test.yaml down -v --remove-orphans
      - name: Start isolated production-mode test services
        run: docker compose --env-file .env.backend.local -f compose.yaml -f compose.test.yaml -f compose.production-test.yaml up -d postgres redis storage migrate api transfers worker lifecycle supervisor
      - name: Production transfer, archive, and sandbox tests
        run: |
          set +e
          docker compose --env-file .env.backend.local -f compose.yaml -f compose.test.yaml -f compose.production-test.yaml run --rm tests pytest -q -m production_integration --junitxml=/ci-test-results/backend-production.xml >.ci-test-results/backend-production.log 2>&1
          status=$?
          echo "Production-mode backend pytest exit code: $status"
          exit "$status"
      - name: Stop isolated production-mode test stack
        if: always()
        run: docker compose --env-file .env.backend.local -f compose.yaml -f compose.test.yaml -f compose.production-test.yaml down -v --remove-orphans
      - name: Summarize backend test failures
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import re

          test_runs = (
              (Path(".ci-test-results/backend-standard.xml"), Path(".ci-test-results/backend-standard.log")),
              (Path(".ci-test-results/backend-production.xml"), Path(".ci-test-results/backend-production.log")),
          )
          found_output = False
          failure_count = 0
          for report, output in test_runs:
              found_output = found_output or report.exists() or output.exists()
              if report.exists():
                  for case in ET.parse(report).iter("testcase"):
                      failure = next((child for child in case if child.tag in {"failure", "error"}), None)
                      if failure is not None:
                          failure_count += 1
                          print(f"::error::Failed backend test: {case.get('classname', '')}::{case.get('name', '')}")
              elif output.exists():
                  for line in output.read_text(errors="replace").splitlines():
                      match = re.match(r"^(FAILED|ERROR)\s+(\S+)", line)
                      if match:
                          failure_count += 1
                          print(f"::error::Pytest {match.group(1).lower()}: {match.group(2)}")
          if not found_output:
              print("::notice::Backend pytest did not produce a test report or console output file.")
          elif not failure_count:
              print("::notice::Backend pytest reports contain no failure node identifiers.")
          PY
      - name: Remove transient backend test reports
        if: always()
        run: rm -rf .ci-test-results
