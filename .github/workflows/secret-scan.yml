name: Secret scan

on:
  push:
    branches: [main, codex/phase17-beta-safeguards-mainline]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/filenimble-gitleaks"
          cd "$RUNNER_TEMP/filenimble-gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            'gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          chmod 0755 gitleaks
          echo "$RUNNER_TEMP/filenimble-gitleaks" >> "$GITHUB_PATH"

      - name: Prove scanner detects a synthetic canary
        shell: bash
        run: |
          set -euo pipefail
          canary_repo="$RUNNER_TEMP/filenimble-gitleaks-canary"
          mkdir -m 700 "$canary_repo"
          cd "$canary_repo"
          git init -q
          git config user.name "Gitleaks Canary"
          git config user.email "gitleaks-canary@example.invalid"
          printf 'ghp_%s\n' "$(openssl rand -hex 18)" > synthetic-canary.txt
          git add synthetic-canary.txt
          git commit -qm 'synthetic scanner control'
          set +e
          gitleaks git . --redact=100 --no-banner --no-color > "$RUNNER_TEMP/gitleaks-canary.log" 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ] || ! grep -q 'github-pat' "$RUNNER_TEMP/gitleaks-canary.log"; then
            echo '::error::Gitleaks did not report the synthetic positive control.'
            exit 1
          fi
          rm -f synthetic-canary.txt "$RUNNER_TEMP/gitleaks-canary.log"

      - name: Scan pull request changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-parse HEAD^ )"
          fi
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          gitleaks git . \
            --log-opts="$BASE_SHA..$HEAD_SHA" \
            --redact=100 --no-banner --no-color \
            --max-archive-depth=5 --max-decode-depth=5
