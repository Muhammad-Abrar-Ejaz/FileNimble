name: Playwright archive reliability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  archive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production frontend
        run: npm run build
      - name: Run archive integrity and accessibility browser tests
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
          PLAYWRIGHT_SERVER_MODE: production
        run: npx playwright test e2e/server-archive-tools.spec.ts e2e/accessibility.spec.ts --project=chromium --workers=1 --reporter=line,json
      - name: Summarize browser test failures safely
        if: failure()
        run: node scripts/summarize-playwright-failures.mjs
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
