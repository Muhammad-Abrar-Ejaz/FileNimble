# Disposable CI-only production-mode overlay. Never use for a deployed service.
x-production-env: &production-env
  APP_ENV: production
  PRODUCTION_CONVERSIONS_ENABLED: "true"
  PRODUCTION_TOOL_ALLOWLIST: tar-to-zip,zip-to-tar
  ENABLE_TEST_CAPABILITY: "0"
  ENABLE_NATIVE_QUALIFICATION: "0"
  TRANSFER_PUBLIC_URL: https://api.example.org
  SITE_ORIGIN: https://www.filenimble.app
  TRANSFER_TOKEN_SECRET: ${TRANSFER_TOKEN_SECRET:?Use generated local CI secrets}
  AI_ENABLED: "false"
  AI_PROVIDER: ""
  AI_MODEL: ""
  GEMINI_API_KEY: ""
services:
  api:
    environment: *production-env
  worker:
    environment: *production-env
  lifecycle:
    environment: *production-env
  supervisor:
    environment:
      APP_ENV: production
      RUNNER_NAMESPACE: phase15-qualification-ci
  tests:
    environment:
      <<: *production-env
      PHASE15_DISPOSABLE: "1"
      RUNNER_NAMESPACE: phase15-qualification-ci
  transfers:
    image: filenimble-backend:phase5
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,noexec,nosuid,nodev"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    command: [uvicorn, app.transfers:app, --host, 0.0.0.0, --port, "8002", --no-access-log]
    environment:
      <<: *production-env
      DATABASE_URL: postgresql://filenimble:${POSTGRES_PASSWORD:?Use generated local CI secrets}@postgres/filenimble
      REDIS_URL: redis://:${REDIS_PASSWORD:?Use generated local CI secrets}@redis:6379/0
      JOB_TOKEN_SECRET: ${JOB_TOKEN_SECRET:?Use generated local CI secrets}
      CONVERSION_API_SECRET: ${CONVERSION_API_SECRET:?Use generated local CI secrets}
      RUNNER_SECRET: ${RUNNER_SECRET:?Use generated local CI secrets}
      S3_ENDPOINT: http://storage:3900
      S3_PUBLIC_ENDPOINT: http://storage:3900
      S3_REGION: garage
      S3_BUCKET: filenimble
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Use generated local CI secrets}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Use generated local CI secrets}
    depends_on:
      storage-init: {condition: service_completed_successfully}
